name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create validation environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet PyYAML
      - name: Validate Skill metadata
        run: .ci-venv/bin/python tests/validate_skill.py skills/safa
      - name: Validate runtime manifest schema JSON
        run: python3 -m json.tool contracts/runtime-manifest-v1.schema.json >/dev/null
      - name: Validate CLI conformance fixtures
        shell: bash
        run: |
          for fixture in conformance/cli-v1/*.json; do
            python3 -m json.tool "$fixture" >/dev/null
          done
      - name: Validate launcher syntax across available shells
        run: |
          sh -n skills/safa/scripts/safa
          bash -n skills/safa/scripts/safa
          if command -v zsh >/dev/null 2>&1; then
            zsh -n skills/safa/scripts/safa
          fi
      - name: Validate fail-closed launcher behavior
        run: tests/launcher_contract.sh
      - name: Check whitespace
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git show --check --format= HEAD
          fi
