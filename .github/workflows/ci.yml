name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: toon-format/toon
          ref: f06ddca16c8a4ccd091f33d7216c543e10a9c681
          path: .conformance-upstream/toon
      - uses: actions/checkout@v7
        with:
          repository: toon-format/spec
          ref: 62f16b369408180f1faf1cba7da1b46d1f336f12
          path: .conformance-upstream/toon-spec
      - uses: actions/setup-node@v6
        with:
          node-version: 23.7.0
      - name: Create validation environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet PyYAML
      - name: Validate Skill metadata
        run: .ci-venv/bin/python tests/validate_skill.py skills/safa
      - name: Validate runtime manifest schema JSON
        run: |
          python3 -m json.tool contracts/runtime-manifest-v1.schema.json >/dev/null
          python3 -m json.tool contracts/source-preview-manifest-v1.schema.json >/dev/null
          python3 -m json.tool skills/safa/manifests/source-preview-macos-v1.json >/dev/null
          python3 tests/validate_source_preview.py \
            contracts/source-preview-manifest-v1.schema.json \
            skills/safa/manifests/source-preview-macos-v1.json
      - name: Strict-decode the public TOON contract with pinned official sources
        run: >-
          node --no-warnings --experimental-strip-types
          tests/verify_toon_conformance.mjs
          .conformance-upstream/toon
          .conformance-upstream/toon-spec
          conformance/agent-cli-v2
      - name: Validate launcher syntax across available shells
        run: |
          sh -n skills/safa/scripts/safa
          sh -n skills/safa/scripts/install-source-preview.sh
          bash -n skills/safa/scripts/safa
          bash -n skills/safa/scripts/install-source-preview.sh
          if command -v zsh >/dev/null 2>&1; then
            zsh -n skills/safa/scripts/safa
            zsh -n skills/safa/scripts/install-source-preview.sh
          fi
      - name: Validate fail-closed launcher behavior
        run: |
          tests/launcher_contract.sh
          tests/source_preview_contract.sh
      - name: Verify exact Source Preview archive
        if: runner.os == 'macOS'
        run: skills/safa/scripts/install-source-preview.sh --verify-source
      - name: Check whitespace
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git show --check --format= HEAD
          fi
